<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Pulso Social: Postador & Engajador PRO</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #080d1a;
      color: #f1f5f9;
      width: 380px;
      min-height: 520px;
      padding: 14px;
      overflow-x: hidden;
      overflow-y: auto;
      user-select: none;
    }
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #080d1a;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }

    /* Top Nav Row */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 14px;
    }
    .nav-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }
    .nav-btn:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
      transform: translateY(-1px);
    }
    .nav-btn.active {
      background: rgba(99, 102, 241, 0.22);
      border-color: #6366f1;
      color: #818cf8;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.35);
    }

    /* Section Header */
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .header-title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-icon {
      color: #6366f1;
      display: flex;
      align-items: center;
    }
    .header-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .header-version {
      font-size: 11px;
      font-weight: 500;
      color: #64748b;
    }
    .refresh-btn {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.16);
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .refresh-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.35);
      color: #fff;
    }

    /* Cards */
    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .card:hover {
      border-color: #334155;
    }

    /* Calibrador Accordion */
    .calibrator-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      cursor: pointer;
    }
    .calibrator-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #94a3b8;
    }
    .chevron-box {
      width: 26px;
      height: 26px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      transition: transform 0.2s;
    }
    .chevron-box.open {
      transform: rotate(180deg);
    }
    .calibrator-content {
      padding: 0 14px 14px 14px;
      display: none;
      border-top: 1px solid #1e293b;
      margin-top: 2px;
      padding-top: 10px;
    }
    .calib-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 11px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .calib-item:last-child {
      border-bottom: none;
    }
    .badge-calib {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 9999px;
      border: 1px solid;
    }
    .badge-calib.ok {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.3);
    }
    .badge-calib.pending {
      background: rgba(148, 163, 184, 0.1);
      color: #94a3b8;
      border-color: rgba(148, 163, 184, 0.2);
    }

    /* Nova Campanha Section */
    .section-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .btn-new-campaign {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border: none;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
      transition: all 0.2s;
      margin-bottom: 12px;
    }
    .btn-new-campaign:hover {
      background: linear-gradient(135deg, #4338ca, #4f46e5);
      box-shadow: 0 6px 18px rgba(79, 70, 229, 0.45);
      transform: translateY(-1px);
    }

    /* Video Banner Card */
    .tutorial-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      cursor: pointer;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 14px;
      margin-bottom: 14px;
      transition: all 0.2s;
    }
    .tutorial-banner:hover {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.04);
    }
    .alert-icon-wrap {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #f59e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .tutorial-title {
      font-size: 12px;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 2px;
    }
    .tutorial-sub {
      font-size: 10.5px;
      color: #94a3b8;
    }

    /* Action Buttons (Execução & Sincronização) */
    .action-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-action {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      transition: all 0.2s;
    }
    .btn-run {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #fff;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    }
    .btn-run:hover {
      background: linear-gradient(135deg, #047857, #059669);
    }
    .btn-stop {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: #fff;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
    }
    .btn-sync {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .btn-sync:hover {
      background: #334155;
      color: #fff;
    }

    /* Connection Box */
    .conn-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .conn-label {
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .conn-input {
      width: 100%;
      background: #080d1a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
      color: #fff;
      margin-bottom: 6px;
    }
    .conn-buttons {
      display: flex;
      gap: 5px;
    }
    .conn-btn {
      padding: 5px 8px;
      font-size: 10px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .conn-btn-save {
      flex: 1;
      background: #4f46e5;
      color: #fff;
    }
    .conn-btn-reset {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .conn-btn-cloud {
      background: #2563eb;
      color: #fff;
    }

    /* Status hint */
    .hint {
      font-size: 11px;
      color: #94a3b8;
      background: #0f172a;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      line-height: 1.4;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .footer {
      font-size: 10px;
      color: #64748b;
      text-align: center;
      padding-top: 6px;
      border-top: 1px solid #1e293b;
    }

    /* Dynamic View Panes */
    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <div class="top-nav">
    <div class="nav-group">
      <!-- 1. Postador PRO (Active) -->
      <button class="nav-btn active" id="tabPostador" title="Postador PRO">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>

      <!-- 2. Engajador PRO -->
      <button class="nav-btn" id="tabEngajador" title="Engajador PRO">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </button>

      <!-- 3. Aquecedores -->
      <button class="nav-btn" id="tabWarmer" title="Aquecedores">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path>
        </svg>
      </button>

      <!-- 4. Biblioteca -->
      <button class="nav-btn" id="tabLibrary" title="Biblioteca de Criativos">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </button>

      <!-- 5. Planos -->
      <button class="nav-btn" id="tabPlans" title="Planos & VIP">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"></path>
        </svg>
      </button>

      <!-- 6. Contas / Config -->
      <button class="nav-btn" id="tabAccounts" title="Contas e Configurações">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </button>
    </div>

    <div class="nav-group">
      <!-- 7. Tutoriais em Vídeo -->
      <button class="nav-btn" id="btnTutorials" title="Tutoriais em Vídeo">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="10 8 16 12 10 16 10 8"></polygon>
        </svg>
      </button>

      <!-- 8. Suporte Técnico -->
      <button class="nav-btn" id="btnSupport" title="Suporte Técnico">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
      </button>

      <!-- 9. Ajuda / Dúvidas -->
      <button class="nav-btn" id="btnHelp" title="Ajuda & FAQ">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </button>

      <!-- 10. Abrir na Nuvem (Vercel) -->
      <button class="nav-btn" id="openVercelPanel" title="Abrir Painel na Vercel (Nuvem)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </button>

      <!-- 11. Abrir Painel Local -->
      <button class="nav-btn" id="openLocalPanel" title="Abrir Painel Local (localhost:5174)">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- MAIN TAB: POSTADOR PRO (Idêntico ao Print 2) -->
  <div id="panePostador" class="tab-pane active">
    <!-- Header Row -->
    <div class="header-row">
      <div class="header-title-box">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </div>
        <div class="header-title">
          Postador PRO <span class="header-version">v5.80.0</span>
        </div>
      </div>
      <button class="refresh-btn" id="btnRefresh" title="Sincronizar e Atualizar">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>

    <!-- CALIBRADOR Accordion -->
    <div class="card" id="calibratorCard">
      <div class="calibrator-header" id="calibratorToggle">
        <div class="calibrator-title">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
          <span>CALIBRADOR</span>
        </div>
        <div class="chevron-box" id="chevronBox">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
      <div class="calibrator-content" id="calibratorContent">
        <div class="calib-item">
          <span>📝 Texto</span>
          <span class="badge-calib ok" id="calibTextBadge">Calibrado ✓</span>
        </div>
        <div class="calib-item">
          <span>🖼️ Foto</span>
          <span class="badge-calib ok" id="calibPhotoBadge">Calibrado ✓</span>
        </div>
        <div class="calib-item">
          <span>🎥 Vídeo</span>
          <span class="badge-calib pending" id="calibVideoBadge">Pendente</span>
        </div>
      </div>
    </div>

    <!-- NOVA CAMPANHA Section -->
    <div>
      <div class="section-label">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <span>NOVA CAMPANHA</span>
      </div>

      <button class="btn-new-campaign" id="btnNewCampaign">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <span>Nova campanha</span>
      </button>
    </div>

    <!-- Como funciona o Postador PRO Banner -->
    <div class="tutorial-banner" id="cardVideoTutorial">
      <div class="alert-icon-wrap">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
          <line x1="12" y1="9" x2="12" y2="13"></line>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
      </div>
      <div>
        <div class="tutorial-title">Como funciona o Postador PRO</div>
        <div class="tutorial-sub">Assista o vídeo antes de criar sua campanha</div>
      </div>
    </div>

    <!-- Disparos & Automação -->
    <div class="action-group">
      <button class="btn-action btn-run" id="runCampaign">
        <span>🚀 Disparar Postagem nos Meus Grupos (100% Automático)</span>
      </button>
      <button class="btn-action btn-stop" id="stopCampaign">
        <span>🛑 PARAR TUDO AGORA (Cancelar Disparos)</span>
      </button>
      <button class="btn-action btn-sync" id="sync">
        <span>⚡ Sincronizar Meus Grupos do Facebook</span>
      </button>
    </div>
  </div>

  <!-- CONEXÃO & CONFIG (Card colapsável / fixo) -->
  <div class="conn-card">
    <div class="conn-label">
      <span>⚡ Conexão da Extensão:</span>
      <span id="connStatusText" style="color: #818cf8;">Local: 3001</span>
    </div>
    <input id="apiInput" type="text" placeholder="http://localhost:3001" class="conn-input" />
    <div class="conn-buttons">
      <button id="btnSaveApi" class="conn-btn conn-btn-save">Salvar</button>
      <button id="btnResetApi" class="conn-btn conn-btn-reset">Padrão 3001</button>
      <button id="btnVercelApi" class="conn-btn conn-btn-cloud">☁️ Nuvem</button>
    </div>
  </div>

  <div class="hint" id="status">Pronto para ações. Escolha uma opção acima.</div>

  <div class="footer">
    Versão 5.80.0 • Arquitetura Cérebro
  </div>

  <script src="popup.js"></script>
</body>
</html>
